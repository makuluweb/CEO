<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stakeholder Map v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1713;
    --muted:#6d675d;
    --faint:#a39c8f;
    --paper:#f0ede6;
    --surface:#fdfcf9;
    --line:#ded8cb;
    --accent:#1f3bb3;
    --accent-soft:#e7eaf8;
    --rail:#cfc8b9;
    --danger-line:#a04b2c;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --radius:12px;
    --tap:44px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}

  header{
    position:sticky;top:0;z-index:30;background:rgba(238,240,243,.86);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 12px) 16px 10px;
  }
  .titlebar{display:flex;align-items:center;gap:10px}
  .backbtn{flex:none;width:34px;height:34px;border-radius:9px;display:none;align-items:center;justify-content:center;color:var(--accent);margin-left:-6px}
  .backbtn.show{display:flex}
  h1{font-size:19px;font-weight:680;margin:0;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{font-size:12px;color:var(--muted)}
  .seg{display:flex;margin-top:12px;background:var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;min-height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
  .seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg.sub{margin:0 0 14px}

  main{padding:14px 16px calc(120px + var(--safe-b))}

  /* ---- Programs ---- */
  .sbo-group{margin-bottom:20px}
  .sbo-head{font-size:15px;font-weight:680;letter-spacing:-.01em;margin:0 2px 2px}
  .aip-head{font-size:12.5px;color:var(--muted);margin:10px 2px 8px;padding-left:10px;border-left:3px solid var(--accent)}
  .prog{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  }
  .prog .body{flex:1;min-width:0}
  .prog .nm{font-weight:650;font-size:16px;letter-spacing:-.01em}
  .prog .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .prog .go{flex:none;color:var(--faint)}

  .ctx{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
  .ctx .path{font-size:12.5px;color:var(--muted)}
  .ctx .path b{color:var(--ink);font-weight:600}
  .ctx .nm{font-size:17px;font-weight:680;letter-spacing:-.01em;margin-top:3px;display:flex;align-items:center;gap:8px}
  .ctx .nm button{margin-left:auto;flex:none;color:var(--accent);font-size:14px;font-weight:600;min-height:32px}
  .ctx .notes{font-size:13px;color:var(--muted);margin-top:6px}

  /* ---- Tiers ---- */
  .tier{margin-bottom:16px}
  .tier-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
  .tier-head .t{font-size:14px;font-weight:680;letter-spacing:-.01em}
  .tier-head .n{font-size:12px;color:var(--muted)}
  .tier-rail{border-left:3px solid var(--accent);padding-left:10px}
  .tier.t2 .tier-rail{border-left-color:#7a97d9}
  .tier.t3 .tier-rail{border-left-color:#b3c3e6}
  .tier.t4 .tier-rail{border-left-color:var(--line)}
  .stk{
    background:var(--surface);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;min-height:var(--tap);
  }
  .stk:active{background:#fafbfc}
  .stk .body{flex:1;min-width:0}
  .stk .nm{font-weight:630;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stk .rl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{flex:none;font-size:11.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:7px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
  .stance{flex:none;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px}

  /* ---- Grid ---- */
  .axis-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:0 2px;margin:6px 0 2px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
  .quad{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:130px}
  .quad .qt{font-size:12.5px;font-weight:680}
  .quad .qs{font-size:11px;color:var(--muted);margin:1px 0 8px}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px}
  .pchip{
    font-size:12.5px;font-weight:560;background:var(--accent-soft);color:var(--accent);
    border:1px solid #c8d6f2;border-radius:999px;padding:5px 10px;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .axis-y{font-size:11.5px;color:var(--muted);margin:4px 2px 0}
  .quad-guide{margin-top:14px;font-size:12.5px;color:var(--muted)}
  .quad-guide b{color:var(--ink);font-weight:620}
  .quad-guide p{margin:0 0 5px}

  /* ---- Plan ---- */
  .plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
  .plan .top{display:flex;align-items:center;gap:8px}
  .plan .nm{font-weight:650;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{flex:none;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--muted)}
  .status.doing{border-color:var(--accent);color:var(--accent)}
  .status.done{background:var(--ink);border-color:var(--ink);color:#fff}
  .plan .msg{font-size:13.5px;margin-top:7px}
  .plan .msg .lbl,.plan .act .lbl{font-size:11px;color:var(--faint);display:block;margin-bottom:1px}
  .plan .act{font-size:13.5px;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
  .plan .act>div{min-width:120px;flex:1}
  .miss{color:var(--faint);font-style:italic}

  /* ---- Pursuits ---- */
  .pur{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
  .pur .top{display:flex;align-items:center;gap:8px}
  .pur .nm{font-weight:650;font-size:15px;flex:1;min-width:0}
  .stage{flex:none;font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
  .stage.propose{border-color:var(--accent);color:var(--accent)}
  .stage.won{background:var(--ink);border-color:var(--ink);color:#fff}
  .stage.lost{color:var(--faint)}
  .pur .val{font-size:13px;color:var(--muted);margin-top:3px}
  .pur .sum{font-size:13.5px;margin-top:7px}
  .pur .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
  .pur .side{font-size:12.5px;min-width:0}
  .pur .side .h{font-size:11px;color:var(--faint);margin-bottom:2px}
  .pur .rline{margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pur .rline span{color:var(--muted)}

  /* ---- People directory ---- */
  .searchrow{display:flex;gap:8px;margin-bottom:14px}
  .searchwrap{position:relative;flex:1}
  .search{width:100%;min-height:var(--tap);padding:0 14px 0 38px;background:var(--surface);border:1px solid var(--line);border-radius:11px;color:var(--ink)}
  .search:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
  .card-top{display:flex;gap:12px;align-items:flex-start}
  .avatar{flex:none;width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
  .who{flex:1;min-width:0}
  .who .nm{font-weight:650;font-size:16px;letter-spacing:-.01em;overflow-wrap:anywhere}
  .who .rl{font-size:13.5px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{font-size:11.5px;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px;max-width:100%}
  .tag b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag .lbl{color:var(--faint);text-transform:uppercase;font-size:9.5px;letter-spacing:.06em}
  .actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .chip{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px;font-weight:560;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
  .chip.ghost{color:var(--muted)}
  .chip svg{width:15px;height:15px}
  .chip:active{background:var(--paper)}
  .reports-line{font-size:12.5px;color:var(--muted);margin-top:9px;display:flex;align-items:center;gap:5px}
  .reports-line b{color:var(--ink);font-weight:600}

  /* ---- Manage mode ---- */
  .tbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tbtn.on svg{color:#fff}
  .listrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:8px;min-height:var(--tap)}
  .listrow .pick{flex:none;width:22px;height:22px;accent-color:var(--accent)}
  .listrow .info{flex:1;min-width:0}
  .listrow .info .nm{font-weight:620;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listrow .info .rl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icobtn{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .icobtn:active{background:var(--paper)}
  .icobtn.trash{color:var(--danger-line);border-color:#d9c2b8}
  .icobtn svg{width:17px;height:17px}
  .bulkbar{
    position:fixed;left:16px;right:16px;bottom:calc(86px + var(--safe-b));z-index:45;
    background:var(--ink);color:#fff;border-radius:14px;display:none;align-items:center;gap:10px;
    padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .bulkbar.show{display:flex}
  .bulkbar .bcount{flex:1;font-size:14px;font-weight:600}
  .bulkbar button{min-height:38px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600}
  .bulkbar .bdel{background:#fff;color:var(--danger-line)}
  .bulkbar .bcancel{color:#cfd6de}

  /* ---- Org tree ---- */
  .node{position:relative}
  .node .row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;min-height:var(--tap)}
  .node .row:active{background:var(--paper)}
  .twist{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--paper)}
  .twist.leaf{visibility:hidden}
  .twist svg{transition:transform .18s ease}
  .node.collapsed > .row .twist svg{transform:rotate(-90deg)}
  .node-body{flex:1;min-width:0}
  .node-body .nm{font-weight:620;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node-body .rl{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node-count{flex:none;font-size:11px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:600}
  .children{margin-left:18px;padding-left:14px;border-left:1.5px solid var(--rail);position:relative}
  .node.collapsed > .children{display:none}
  @media (prefers-reduced-motion:reduce){.twist svg{transition:none}}
  .roots-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:4px 2px 8px}

  /* ---- Shared ---- */
  .empty{text-align:center;padding:46px 24px;color:var(--muted)}
  .empty h2{font-size:16px;color:var(--ink);margin:0 0 6px;font-weight:620}
  .empty p{margin:0;font-size:14px;max-width:290px;margin-inline:auto}
  .fab{
    position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:40;height:54px;padding:0 20px 0 17px;
    border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:640;
    display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(39,86,200,.34);
  }
  .fab:active{transform:translateY(1px)}
  .fab svg{width:20px;height:20px}
  .toolbar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .tbtn{
    flex:1;min-width:130px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
    font-size:13px;font-weight:560;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;
  }
  .tbtn:active{background:var(--paper)}
  .tbtn svg{width:15px;height:15px;color:var(--muted)}
  .hint{font-size:12px;color:var(--faint);margin-top:8px;text-align:center}

  .scrim{position:fixed;inset:0;z-index:50;background:rgba(20,25,30,.42);display:none;align-items:flex-end;justify-content:center}
  .scrim.open{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:rise .26s cubic-bezier(.2,.8,.2,1)}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:20px 20px 0 0}
  .sheet-head h3{margin:0;font-size:16px;font-weight:660}
  .sheet-head button{font-size:15px;color:var(--accent);font-weight:600;min-height:36px;padding:0 4px}
  .sheet-head button.del{color:var(--danger-line)}
  .sheet-body{overflow-y:auto;padding:14px 16px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  .field textarea{min-height:76px;resize:vertical;line-height:1.4}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .field .sub{font-size:12px;color:var(--faint);margin-top:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .save{width:100%;min-height:50px;background:var(--accent);color:#fff;border-radius:13px;font-size:16px;font-weight:640;margin-top:6px}
  .save:active{transform:translateY(1px)}
  .save:disabled{opacity:.45}
  .req{color:var(--danger-line)}

  .toast{
    position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:550;padding:10px 16px;border-radius:11px;
    z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<style>
  /* ============ Editorial design layer ============ */
  header{background:rgba(240,237,230,.9);padding-top:calc(var(--safe-t) + 14px)}
  .overline{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  h1{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
  .count{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .backbtn{color:var(--ink)}

  /* Tabs: pill seg -> editorial underline tabs */
  .seg{background:none;border-radius:0;padding:0;gap:20px;border-bottom:1px solid var(--line);margin-top:8px}
  .seg button{flex:0 1 auto;min-height:38px;border-radius:0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--faint);position:relative;padding:0 1px}
  .seg button[aria-selected="true"]{background:none;color:var(--ink);box-shadow:none}
  .seg button[aria-selected="true"]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
  .seg.sub{margin:0 0 16px}

  /* Screen entrances */
  #view-programs,#view-program,#view-pursuit,#view-people{animation:pageIn .24s ease both}
  @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#view-programs,#view-program,#view-pursuit,#view-people{animation:none}}

  /* The Agenda: numbered SBO sections */
  .sbo-group{margin-bottom:28px}
  .sbo-head{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;margin:0 2px 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .sbo-head .no{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.12em}
  .aip-head{border-left:2px solid var(--accent);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:14px 2px 8px;padding:1px 0 1px 10px}
  .prog{box-shadow:0 1px 0 rgba(26,23,19,.05)}
  .prog .nm{font-family:var(--serif);font-size:18px;font-weight:600}
  .prog .meta{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:5px}

  /* Program & pursuit context */
  .ctx{box-shadow:0 1px 0 rgba(26,23,19,.05)}
  .ctx .path{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .ctx .path b{color:var(--accent);font-weight:600}
  .ctx .nm{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em}

  /* Tiers: seniority as ink depth */
  .tier-head .t{font-family:var(--serif);font-size:16.5px;font-weight:600}
  .tier-head .n{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint)}
  .tier-rail{border-left-width:2px}
  .tier.t1 .tier-rail{border-left-color:var(--ink)}
  .tier.t2 .tier-rail{border-left-color:var(--accent)}
  .tier.t3 .tier-rail{border-left-color:#8f8778}
  .tier.t4 .tier-rail{border-left-color:var(--line)}
  .badge{font-family:var(--mono);border-radius:6px}
  .stance{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}

  /* Grid: printed matrix, priority quadrant washed in accent */
  .quad .qt{font-family:var(--serif);font-size:15.5px;font-weight:600}

<script>
/* Stakeholder Map v2 — org directory + program stakeholder & pursuit mapping.
   Data lives only in this browser's local storage. Nothing is transmitted. */
const KEY_MAP='stakemap_v1';        // same keys as v1 apps: existing data on the
const KEY_ORG='orgchart_contacts_v1'; // same origin carries over automatically
let data={programs:[]};
let contacts=[];
let screen='programs';   // 'programs' | 'program' | 'pursuit' | 'people'
let progTab='tiers';
let pursuitTab='grid';
let peopleView='list';
let manage=false;
let selected=new Set();
let collapsed={};
let currentId=null;
let currentPursuitId=null;

const TIERS=['Senior Ownership','Business Value Owner','Delivery Team','Influencer'];
const RACI={A:'Accountable',R:'Responsible',C:'Consulted',I:'Informed'};
const STAGES=['Identify','Qualify','Propose','Won','Lost'];

/* ---------- storage & shared ---------- */
function load(){
  try{const r=localStorage.getItem(KEY_MAP);data=r?JSON.parse(r):{programs:[]};}catch(e){data={programs:[]};}
  if(!data||!Array.isArray(data.programs))data={programs:[]};
  data.programs.forEach(p=>{
    if(!Array.isArray(p.stakeholders))p.stakeholders=[];
    if(!Array.isArray(p.pursuits))p.pursuits=[];
    p.pursuits.forEach(u=>{if(!Array.isArray(u.members))u.members=[];});
  });
  try{const c=localStorage.getItem(KEY_ORG);contacts=c?JSON.parse(c):[];}catch(e){contacts=[];}
  if(!Array.isArray(contacts))contacts=[];
}
function saveMap(){try{localStorage.setItem(KEY_MAP,JSON.stringify(data));}catch(e){toast('Could not save — storage full or blocked');}}
function saveOrg(){try{localStorage.setItem(KEY_ORG,JSON.stringify(contacts));}catch(e){toast('Could not save — storage full or blocked');}}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function byId(id){return contacts.find(c=>c.id===id);}
function nameOf(id){const c=byId(id);return c?c.name:'';}
function initials(name){
  const p=(name||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length)return '?';
  if(p.length===1)return p[0].slice(0,2).toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}
function prog(){return data.programs.find(p=>p.id===currentId);}
function curPursuit(){const p=prog();return p?p.pursuits.find(u=>u.id===currentPursuitId):null;}
function stakeholderById(p,id){return p.stakeholders.find(s=>s.id===id);}
function download(filename,text,type){
  const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function stamp(){return new Date().toISOString().slice(0,10);}
function csvCell(v){v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function closeSheet(id){document.getElementById(id).classList.remove('open');}

/* ---------- navigation ---------- */
function setMain(s){
  screen=s;currentId=null;currentPursuitId=null;
  if(s!=='people'&&manage){manage=false;selected=new Set();const b=document.getElementById('manage-btn');b.textContent='Manage';b.classList.remove('on');}
  render();
}
function goBack(){
  if(screen==='pursuit'){screen='program';currentPursuitId=null;progTab='pursuits';render();}
  else setMain('programs');
}
function openProgram(id){screen='program';currentId=id;progTab='tiers';render();}
function openPursuit(id){screen='pursuit';currentPursuitId=id;pursuitTab='grid';render();}
function setProgTab(t){progTab=t;render();}
function setPursuitTab(t){pursuitTab=t;render();}

function fabTap(){
  if(screen==='programs')return openProgramForm();
  if(screen==='program')return progTab==='pursuits'?openPursuitForm():openStakeholderForm();
  if(screen==='pursuit')return openMemberPicker();

/* ---------- render dispatcher ---------- */
function render(){
  const inProgram=screen==='program';
  const inPursuit=screen==='pursuit';
  document.getElementById('view-programs').style.display=screen==='programs'?'':'none';
  document.getElementById('view-program').style.display=inProgram?'':'none';
  document.getElementById('view-pursuit').style.display=inPursuit?'':'none';
  document.getElementById('view-people').style.display=screen==='people'?'':'none';
  document.getElementById('backbtn').classList.toggle('show',inProgram||inPursuit);
  document.getElementById('mainseg').style.display=(inProgram||inPursuit)?'none':'flex';
  document.getElementById('progtabs').style.display=inProgram?'flex':'none';
  document.getElementById('main-programs').setAttribute('aria-selected',screen==='programs');
  document.getElementById('main-people').setAttribute('aria-selected',screen==='people');
  ['tiers','grid','plan','pursuits'].forEach(t=>document.getElementById('tab-'+t).setAttribute('aria-selected',t===progTab));
  document.getElementById('uv-grid').setAttribute('aria-selected',pursuitTab==='grid');
  document.getElementById('uv-plan').setAttribute('aria-selected',pursuitTab==='plan');
  document.getElementById('pv-list').setAttribute('aria-selected',peopleView==='list');
  document.getElementById('pv-chart').setAttribute('aria-selected',peopleView==='chart');
  document.getElementById('fab-label').textContent=
    screen==='programs'?'Program':(inProgram?(progTab==='pursuits'?'Pursuit':'Stakeholder'):(inPursuit?'Stakeholder':'Person'));

  if(screen==='programs'){
    document.getElementById('title').textContent='The Agenda';
    const n=data.programs.length;
    document.getElementById('count').textContent=n?(n+' program'+(n===1?'':'s')):'';
    renderPrograms();
  }else if(inProgram){
    const p=prog();
    if(!p){setMain('programs');return;}
    document.getElementById('title').textContent=p.name;
    document.getElementById('count').textContent=p.stakeholders.length+' stk';
    renderProgramDetail();
  }else if(inPursuit){
    const u=curPursuit();
    if(!u){goBack();return;}
    document.getElementById('title').textContent=u.name;
    document.getElementById('count').textContent=u.members.length+' stk';
    renderPursuitDetail();
  }else{
    document.getElementById('title').textContent='People';
    document.getElementById('count').textContent=contacts.length+' '+(contacts.length===1?'person':'people');
    document.getElementById('people-list-wrap').style.display=peopleView==='list'?'':'none';
    document.getElementById('people-chart-wrap').style.display=peopleView==='chart'?'':'none';
    peopleView==='list'?renderDirectory():renderOrgTree();
  }
  updateBulkbar();
}

/* ================= PROGRAMS ================= */
function renderPrograms(){
  const el=document.getElementById('view-programs');
  if(!data.programs.length){
    el.innerHTML=`<div class="empty"><h2>No programs yet</h2><p>Add a program and anchor it to its Strategic Business Objective and AIP. Then map the stakeholders who decide whether it succeeds.</p></div>`+programsToolbar();
    return;
  }
  const bySbo={};
  data.programs.forEach(p=>{
    const s=p.sbo||'(No SBO)';const a=p.aip||'(No AIP)';
    bySbo[s]=bySbo[s]||{};bySbo[s][a]=bySbo[s][a]||[];bySbo[s][a].push(p);
  });
  const SBO_ORDER=['Copper Growth','Operating Excellence','Project Excellence','Technology','Social Value & Sustainability'];
  const sboKeys=Object.keys(bySbo).sort((a,b)=>{
    const ia=SBO_ORDER.indexOf(a),ib=SBO_ORDER.indexOf(b);
    if(ia!==-1&&ib!==-1)return ia-ib;
    if(ia!==-1)return -1;
    if(ib!==-1)return 1;
    return a.localeCompare(b);
  });
  let html='';
  sboKeys.forEach((s,si)=>{
    html+=`<div class="sbo-group"><div class="sbo-head"><span class="no">${String(si+1).padStart(2,'0')}</span>${esc(s)}</div>`;
    Object.keys(bySbo[s]).sort().forEach(a=>{
      html+=`<div class="aip-head">${esc(a)}</div>`;
      bySbo[s][a].forEach(p=>{
        const open=p.stakeholders.filter(x=>x.action&&x.status!=='Done').length;
        const meta=[p.stakeholders.length+' stakeholder'+(p.stakeholders.length===1?'':'s')];
        if((p.pursuits||[]).length)meta.push(p.pursuits.length+' pursuit'+(p.pursuits.length===1?'':'s'));
        if(open)meta.push(open+' open action'+(open===1?'':'s'));
        html+=`<div class="prog" onclick="openProgram('${p.id}')">
          <div class="body"><div class="nm">${esc(p.name)}</div><div class="meta">${meta.join(' — ')}</div></div>
          <svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>`;
      });
    });
    html+='</div>';
  });
  el.innerHTML=html+programsToolbar();
}
function programsToolbar(){
  return `<div class="toolbar">
    <button class="tbtn" onclick="exportMap()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Export programs</button>
    <button class="tbtn" onclick="document.getElementById('map-importer').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 9l5-5 5 5"/><path d="M12 4v12"/></svg>Import programs</button>
  </div>
  <div class="hint">People from the People tab are suggested when you add stakeholders or pursuit roles.</div>`;
}

function renderProgramDetail(){
  const p=prog();
  const el=document.getElementById('view-program');
  const ctx=`<div class="ctx">
    <div class="path"><b>${esc(p.sbo)}</b> › ${esc(p.aip)}</div>
    <div class="nm">${esc(p.name)}<button onclick="openProgramForm('${p.id}')">Edit</button></div>
    ${p.notes?`<div class="notes">${esc(p.notes)}</div>`:''}
  </div>`;
  let body='';
  if(progTab==='pursuits'){
    body=renderPursuits(p);
  }else if(!p.stakeholders.length){
    body=`<div class="empty"><h2>No stakeholders mapped</h2><p>Add the people who own, fund, deliver and influence this program — accountable and interested alike.</p></div>`;
  }else if(progTab==='tiers')body=renderTiers(p);
  else if(progTab==='grid')body=renderGrid(p);
  else body=renderPlan(p);
  el.innerHTML=ctx+body;
}

function renderTiers(p){
  let html='';
  TIERS.forEach((t,i)=>{
    const list=p.stakeholders.filter(s=>s.tier===t);
    if(!list.length)return;
    html+=`<div class="tier t${i+1}"><div class="tier-head"><span class="t">${esc(t)}</span><span class="n">${list.length}</span></div><div class="tier-rail">`;
    list.forEach(s=>{
      html+=`<div class="stk" onclick="openStakeholderForm('${s.id}')">
        <span class="badge" title="${RACI[s.raci]||''}">${esc(s.raci||'')}</span>
        <div class="body"><div class="nm">${esc(s.name)}</div>${s.role?`<div class="rl">${esc(s.role)}</div>`:''}</div>
        <span class="stance">${esc(s.stance||'')}</span>
      </div>`;
    });
    html+='</div></div>';
  });
  return html||'<div class="empty"><p>Stakeholders exist but have no tier set. Tap Plan to review them.</p></div>';
}

function quadrant(s){
  const hi=v=>v==='High';
  if(hi(s.influence)&&hi(s.interest))return 0;
  if(hi(s.influence))return 1;
  if(hi(s.interest))return 2;
  return 3;
}
function renderGrid(p){
  const quads=[[],[],[],[]];
  p.stakeholders.forEach(s=>quads[quadrant(s)].push(s));
  const chip=s=>`<button class="pchip" onclick="openStakeholderForm('${s.id}')">${esc(s.name)}</button>`;
  const q=(idx,title,subtitle)=>`<div class="quad"><div class="qt">${title}</div><div class="qs">${subtitle}</div><div class="chiprow">${quads[idx].map(chip).join('')||'<span style="font-size:12px;color:var(--faint)">—</span>'}</div></div>`;
  return `<div>
    <div class="axis-y">Influence high ↑</div>
    <div class="pgrid">
      ${q(1,'Keep satisfied','High influence, lower interest')}
      ${q(0,'Manage closely','High influence, high interest')}
      ${q(3,'Monitor','Lower influence, lower interest')}
      ${q(2,'Keep informed','High interest, lower influence')}
    </div>
    <div class="axis-x"><span>Interest low</span><span>Interest high →</span></div>
    <div class="quad-guide">
      <p><b>Manage closely</b> — engage directly and often; co-design the outcome with them.</p>
      <p><b>Keep satisfied</b> — enough substance to hold confidence; never let them be surprised.</p>
      <p><b>Keep informed</b> — regular updates and access; they carry your story into the business.</p>
      <p><b>Monitor</b> — light touch; watch for movement in either axis.</p>
    </div>
  </div>`;
}

function renderPlan(p){
  const order=s=>TIERS.indexOf(s.tier);
  const list=p.stakeholders.slice().sort((a,b)=>order(a)-order(b)||(a.name||'').localeCompare(b.name||''));
  let html=list.map(s=>{
    const st=s.status||'Not started';
    const cls=st==='Done'?'done':(st==='In progress'?'doing':'');
    return `<div class="plan" onclick="openStakeholderForm('${s.id}')">
      <div class="top"><span class="badge">${esc(s.raci||'')}</span><span class="nm">${esc(s.name)}</span><span class="status ${cls}">${esc(st)}</span></div>
      <div class="msg"><span class="lbl">Key message</span>${s.message?esc(s.message):'<span class="miss">Not set</span>'}</div>
      <div class="act">
        <div><span class="lbl">KPMG owner</span>${s.owner?esc(s.owner):'<span class="miss">Unassigned</span>'}</div>
        <div><span class="lbl">Next action</span>${s.action?esc(s.action):'<span class="miss">None</span>'}</div>
      </div>
    </div>`;
  }).join('');
  html+=`<div class="toolbar"><button class="tbtn" onclick="exportStakeholdersCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Export stakeholders (CSV)</button></div>`;
  return html;
}

function renderPursuits(p){
  if(!p.pursuits.length){
    return `<div class="empty"><h2>No pursuits yet</h2><p>Add the specific opportunities under this AIP — each with its BHP sponsorship and KPMG delivery structure.</p></div>`;
  }
  const order=u=>STAGES.indexOf(u.stage);
  const list=p.pursuits.slice().sort((a,b)=>order(a)-order(b)||(a.name||'').localeCompare(b.name||''));
  const stageCls=s=>s==='Won'?'won':(s==='Lost'?'lost':(s==='Propose'?'propose':''));
  const line=(l,v)=>`<div class="rline"><span>${l}</span> ${v?esc(v):'<span class="miss">TBC</span>'}</div>`;
  let html=list.map(u=>`<div class="pur" onclick="openPursuit('${u.id}')">
    <div class="top"><span class="nm">${esc(u.name)}</span><span class="stage ${stageCls(u.stage)}">${esc(u.stage)}</span></div>
    ${u.value||u.milestone?`<div class="val">${[u.value,u.milestone].filter(Boolean).map(esc).join(' — ')}</div>`:''}
    ${u.summary?`<div class="sum">${esc(u.summary)}</div>`:''}
    <div class="roles">
      <div class="side"><div class="h">BHP</div>${line('Sponsor',u.bhpSponsor)}${line('Owner',u.bhpOwner)}</div>
      <div class="side"><div class="h">KPMG</div>${line('Sponsor',u.kpmgSponsor)}${line('Lead',u.kpmgLead)}${line('Delivery',u.deliveryLead)}</div>
    </div>
    <div class="val" style="margin-top:7px">${(u.members||[]).length} stakeholder${(u.members||[]).length===1?'':'s'} mapped${u.team?' — Team: '+esc(u.team):''}</div>
  </div>`).join('');
  html+=`<div class="toolbar"><button class="tbtn" onclick="exportPursuitsCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Export pursuits (CSV)</button></div>`;
  return html;
}

/* ---------- program form ---------- */
function openProgramForm(id){
  const p=id?data.programs.find(x=>x.id===id):null;
  document.getElementById('p-id').value=p?p.id:'';
  document.getElementById('p-sbo').value=p?p.sbo:'';
  document.getElementById('p-aip').value=p?p.aip:'';
  document.getElementById('p-name').value=p?p.name:'';
  document.getElementById('p-notes').value=p?(p.notes||''):'';
  document.getElementById('p-title').textContent=p?'Edit program':'Add program';
  document.getElementById('p-del').style.visibility=p?'visible':'hidden';
  const sbos=[...new Set(data.programs.map(x=>x.sbo).filter(Boolean))].sort();
  const aips=[...new Set(data.programs.map(x=>x.aip).filter(Boolean))].sort();
  document.getElementById('dl-sbo').innerHTML=sbos.map(v=>`<option value="${esc(v)}">`).join('');
  document.getElementById('dl-aip').innerHTML=aips.map(v=>`<option value="${esc(v)}">`).join('');
  pValidate();
  document.getElementById('pscrim').classList.add('open');
}
function pValidate(){
  const ok=['p-sbo','p-aip','p-name'].every(i=>document.getElementById(i).value.trim());
  document.getElementById('p-save').disabled=!ok;
}
function saveProgram(){
  const id=document.getElementById('p-id').value;
  const vals={
    sbo:document.getElementById('p-sbo').value.trim(),
    aip:document.getElementById('p-aip').value.trim(),
    name:document.getElementById('p-name').value.trim(),
    notes:document.getElementById('p-notes').value.trim()
  };
  if(!vals.sbo||!vals.aip||!vals.name)return;
  if(id){Object.assign(data.programs.find(x=>x.id===id),vals);toast('Program updated');}
  else{const p={id:uid(),...vals,stakeholders:[],pursuits:[]};data.programs.push(p);toast('Program added');currentId=p.id;screen='program';progTab='tiers';}
  saveMap();closeSheet('pscrim');render();
}
function deleteProgram(){
  const id=document.getElementById('p-id').value;if(!id)return;
  const p=data.programs.find(x=>x.id===id);
  if(!confirm('Delete "'+p.name+'" with '+p.stakeholders.length+' stakeholders and '+p.pursuits.length+' pursuits?'))return;
  data.programs=data.programs.filter(x=>x.id!==id);
  saveMap();closeSheet('pscrim');setMain('programs');toast('Program deleted');
}

function deleteStakeholder(){
  const p=prog();const id=document.getElementById('s-id').value;
  if(!p||!id)return;
  const s=p.stakeholders.find(x=>x.id===id);
  const onPursuits=p.pursuits.filter(u=>(u.members||[]).some(m=>m.ref===id)).length;
  let msg='Remove '+s.name+' from this map?';
  if(onPursuits)msg+='\n\nThey are on '+onPursuits+' pursuit'+(onPursuits===1?'':'s')+' here — they will be removed from those too.';

  p.stakeholders=p.stakeholders.filter(x=>x.id!==id);
  p.pursuits.forEach(u=>{u.members=(u.members||[]).filter(m=>m.ref!==id);});
  saveMap();closeSheet('sscrim');render();toast('Removed');

    return s?{m,s}:null;
  }).filter(Boolean);
}
function renderPursuitDetail(){
  const p=prog();const u=curPursuit();
  const stageCls=s=>s==='Won'?'won':(s==='Lost'?'lost':(s==='Propose'?'propose':''));
  const line=(l,v)=>`<div class="rline"><span>${l}</span> ${v?esc(v):'<span class="miss">TBC</span>'}</div>`;
  document.getElementById('pursuit-ctx').innerHTML=`<div class="ctx">

      <div class="side"><div class="h" style="font-size:11px;color:var(--faint);margin-bottom:2px">BHP</div>${line('Sponsor',u.bhpSponsor)}${line('Owner',u.bhpOwner)}</div>

function renderPursuitGrid(members){
  const quads=[[],[],[],[]];
  members.forEach(x=>quads[quadrant(x.s)].push(x));
  const chip=x=>`<button class="pchip" onclick="openMemberForm('${x.m.id}')">${esc(x.s.name)}</button>`;
  const q=(idx,title,subtitle)=>`<div class="quad"><div class="qt">${title}</div><div class="qs">${subtitle}</div><div class="chiprow">${quads[idx].map(chip).join('')||'<span style="font-size:12px;color:var(--faint)">—</span>'}</div></div>`;
  return `<div>
    <div class="axis-y">Influence high ↑</div>
    <div class="pgrid">
      ${q(1,'Keep satisfied','High influence, lower interest')}
      ${q(0,'Manage closely','High influence, high interest')}
      ${q(3,'Monitor','Lower influence, lower interest')}
      ${q(2,'Keep informed','High interest, lower influence')}
    </div>
    <div class="axis-x"><span>Interest low</span><span>Interest high →</span></div>

function renderPursuitPlan(members){
  const order=x=>TIERS.indexOf(x.s.tier);
  const list=members.slice().sort((a,b)=>order(a)-order(b)||(a.s.name||'').localeCompare(b.s.name||''));
  let html=list.map(x=>{
    const st=x.m.status||'Not started';
    const cls=st==='Done'?'done':(st==='In progress'?'doing':'');
    return `<div class="plan" onclick="openMemberForm('${x.m.id}')">
      <div class="top"><span class="badge">${esc(x.m.raci||'')}</span><span class="nm">${esc(x.s.name)}</span><span class="status ${cls}">${esc(st)}</span></div>

      <div class="act">

        <div><span class="lbl">Next action</span>${x.m.action?esc(x.m.action):'<span class="miss">None</span>'}</div>
      </div>

  }).join('');
  html+=`<div class="toolbar"><button class="tbtn" onclick="exportPursuitPlanCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Export this plan (CSV)</button></div>`;
  return html;
}

function addMember(refId){

function openMemberForm(mid){

function removeMember(){

/* ---------- map export / import / CSVs ---------- */
function exportMap(){
  if(!data.programs.length)return toast('Nothing to export');
  download('stakeholder-map-'+stamp()+'.json',JSON.stringify(data,null,2),'application/json');
  toast('Exported');
}
function importMap(ev){
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d||!Array.isArray(d.programs))throw new Error('bad');
      d.programs.forEach(p=>{if(!Array.isArray(p.stakeholders))p.stakeholders=[];if(!Array.isArray(p.pursuits))p.pursuits=[];});
      const replace=data.programs.length?confirm('Replace all '+data.programs.length+' current programs?\n\nOK = replace everything · Cancel = add to existing'):true;
      if(replace)data=d;
      else{
        const existing=new Set(data.programs.map(p=>p.id));
        d.programs.forEach(p=>{if(existing.has(p.id))p.id=uid();data.programs.push(p);});
      }
      saveMap();render();toast('Imported '+d.programs.length+' program'+(d.programs.length===1?'':'s'));
    }catch(e){toast('Could not read that file');}
    ev.target.value='';
  };
  reader.readAsText(file);
}

  if(screen==='people')document.getElementById('count').textContent=contacts.length+' '+(contacts.length===1?'person':'people');

  if(!contacts.length){
    list.innerHTML=`<div class="empty"><h2>No one here yet</h2><p>Tap Add to capture your first contact, or Import JSON to load your org chart export. People here feed the stakeholder and pursuit pickers.</p></div>`;
    return;
  }
  if(!rows.length){
    list.innerHTML=`<div class="empty"><h2>No matches</h2><p>Nothing matches “${esc(q)}”.</p></div>`;
    return;
  }
  if(manage){
    list.innerHTML=rows.map(c=>`<div class="listrow">
      <input type="checkbox" class="pick" ${selected.has(c.id)?'checked':''} onchange="togglePick('${c.id}',this.checked)" aria-label="Select ${esc(c.name)}">
      <div class="info" onclick="openPersonForm('${c.id}')">
        <div class="nm">${esc(c.name)}</div>
        <div class="rl">${esc([c.role,c.function].filter(Boolean).join(' · '))}</div>
      </div>
      <button class="icobtn" onclick="openPersonForm('${c.id}')" aria-label="Edit ${esc(c.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></button>
      <button class="icobtn trash" onclick="quickDelete('${c.id}')" aria-label="Delete ${esc(c.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>`).join('');
    return;
  }
  list.innerHTML=rows.map(c=>{
    const tags=[];
    if(c.function)tags.push(`<span class="tag"><span class="lbl">Fn</span><b>${esc(c.function)}</b></span>`);
    if(c.location)tags.push(`<span class="tag"><span class="lbl">Loc</span><b>${esc(c.location)}</b></span>`);
    const acts=[];
    if(c.email)acts.push(`<a class="chip" href="mailto:${esc(c.email)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</a>`);
    if(c.phone)acts.push(`<a class="chip" href="tel:${esc(c.phone)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>Call</a>`);
    acts.push(`<button class="chip ghost" onclick="openPersonForm('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>Edit</button>`);
    const rep=c.reportsTo&&byId(c.reportsTo)?`<div class="reports-line"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>Reports to <b>${esc(nameOf(c.reportsTo))}</b></div>`:'';
    return `<div class="card">
      <div class="card-top">
        <div class="avatar mono">${esc(initials(c.name))}</div>
        <div class="who">
          <div class="nm">${esc(c.name)}</div>
          ${c.role?`<div class="rl">${esc(c.role)}</div>`:''}
        </div>
      </div>
      ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}
      ${rep}
      <div class="actions">${acts.join('')}</div>
    </div>`;
  }).join('');
}

function renderOrgTree(){
  const area=document.getElementById('chart-area');
  if(!contacts.length){
    area.innerHTML=`<div class="empty"><h2>Nothing to chart yet</h2><p>Add people and set who they report to. The hierarchy appears here.</p></div>`;
    return;
  }
  const ids=new Set(contacts.map(c=>c.id));
  const kids={};
  contacts.forEach(c=>{kids[c.id]=[];});
  const roots=[];
  contacts.forEach(c=>{
    if(c.reportsTo && ids.has(c.reportsTo) && c.reportsTo!==c.id)kids[c.reportsTo].push(c);
    else roots.push(c);
  });
  const sortFn=(a,b)=>(a.name||'').localeCompare(b.name||'');
  roots.sort(sortFn);
  Object.values(kids).forEach(arr=>arr.sort(sortFn));
  const seen=new Set();
  function countDesc(id){
    let n=0;const stack=[...(kids[id]||[])];const visited=new Set();
    while(stack.length){const x=stack.pop();if(visited.has(x.id))continue;visited.add(x.id);n++;stack.push(...(kids[x.id]||[]));}
    return n;
  }
  function node(c){
    if(seen.has(c.id)){
      return `<div class="node"><div class="row"><span class="twist leaf"></span><div class="node-body"><div class="nm">${esc(c.name)}</div><div class="rl">↳ already shown above</div></div></div></div>`;
    }
    seen.add(c.id);
    const ch=kids[c.id]||[];
    const isCol=collapsed[c.id];
    const tw=ch.length
      ? `<button class="twist" onclick="toggleNode(event,'${c.id}')" aria-label="Toggle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>`
      : `<span class="twist leaf"></span>`;
    const cnt=ch.length?`<span class="node-count mono">${countDesc(c.id)}</span>`:'';
    const childHTML=ch.length?`<div class="children">${ch.map(node).join('')}</div>`:'';
    return `<div class="node${isCol?' collapsed':''}">
      <div class="row" onclick="openPersonForm('${c.id}')">
        ${tw}
        <div class="node-body">
          <div class="nm">${esc(c.name)}</div>
          ${c.role?`<div class="rl">${esc(c.role)}</div>`:''}
        </div>
        ${cnt}
      </div>
      ${childHTML}
    </div>`;
  }
  const label=roots.length===contacts.length?'Everyone (no reporting links set)':'Top of chain';
  area.innerHTML=`<div class="roots-label">${label}</div><div>${roots.map(node).join('')}</div>`;
}
function toggleNode(ev,id){
  ev.stopPropagation();
  collapsed[id]=!collapsed[id];
  renderOrgTree();
}

/* ---------- person form ---------- */
function refreshDatalists(){
  const fill=(elId,key)=>{
    const vals=[...new Set(contacts.map(c=>c[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    document.getElementById(elId).innerHTML=vals.map(v=>`<option value="${esc(v)}">`).join('');
  };
  fill('dl-role','role');fill('dl-location','location');fill('dl-function','function');
}
function openPersonForm(id){
  refreshDatalists();
  const banned=new Set();
  if(id){
    banned.add(id);
    const kids={};contacts.forEach(c=>kids[c.id]=[]);
    contacts.forEach(c=>{if(c.reportsTo&&kids[c.reportsTo])kids[c.reportsTo].push(c.id);});
    const stack=[id];while(stack.length){const x=stack.pop();(kids[x]||[]).forEach(k=>{if(!banned.has(k)){banned.add(k);stack.push(k);}});}
  }
  const sel=document.getElementById('f-reports');
  const opts=['<option value="">— No one (top level) —</option>']
    .concat(contacts.filter(c=>!banned.has(c.id)).sort((a,b)=>(a.name||'').localeCompare(b.name||''))
      .map(c=>`<option value="${c.id}">${esc(c.name)}${c.role?' · '+esc(c.role):''}</option>`));
  sel.innerHTML=opts.join('');

  const c=id?byId(id):null;
  document.getElementById('f-id').value=c?c.id:'';
  document.getElementById('f-name').value=c?c.name||'':'';
  document.getElementById('f-role').value=c?c.role||'':'';
  document.getElementById('f-email').value=c?c.email||'':'';
  document.getElementById('f-phone').value=c?c.phone||'':'';
  document.getElementById('f-location').value=c?c.location||'':'';
  document.getElementById('f-function').value=c?c.function||'':'';
  document.getElementById('f-reports').value=c?(c.reportsTo||''):'';
  document.getElementById('f-notes').value=c?c.notes||'':'';
  document.getElementById('f-title').textContent=c?'Edit person':'Add person';
  document.getElementById('f-del').style.visibility=c?'visible':'hidden';
  document.getElementById('fscrim').classList.add('open');
  personValidate();
  if(!c)setTimeout(()=>document.getElementById('f-name').focus(),120);
}
function personValidate(){
  document.getElementById('f-save').disabled=!document.getElementById('f-name').value.trim();
}
function savePerson(){
  const name=document.getElementById('f-name').value.trim();
  if(!name)return;
  const vals={
    name,
    role:document.getElementById('f-role').value.trim(),
    email:document.getElementById('f-email').value.trim(),
    phone:document.getElementById('f-phone').value.trim(),
    location:document.getElementById('f-location').value.trim(),
    function:document.getElementById('f-function').value.trim(),
    reportsTo:document.getElementById('f-reports').value,
    notes:document.getElementById('f-notes').value.trim()
  };
  const id=document.getElementById('f-id').value;
  if(id){Object.assign(byId(id),vals);toast('Updated');}
  else{contacts.push({id:uid(),...vals});toast('Added');}
  saveOrg();closeSheet('fscrim');render();
}
function removeContacts(ids){
  const idSet=new Set(ids);
  const parentOf=id=>{const c=byId(id);return c?c.reportsTo:'';};
  const surviving=id=>{
    let p=parentOf(id);const seen=new Set();
    while(p&&idSet.has(p)&&!seen.has(p)){seen.add(p);p=parentOf(p);}
    return (p&&byId(p)&&!idSet.has(p))?p:'';
  };
  contacts.forEach(c=>{
    if(!idSet.has(c.id)&&c.reportsTo&&idSet.has(c.reportsTo))c.reportsTo=surviving(c.reportsTo);
  });
  contacts=contacts.filter(c=>!idSet.has(c.id));
  ids.forEach(id=>{delete collapsed[id];selected.delete(id);});
  saveOrg();
}
function deleteMsg(ids){
  const idSet=new Set(ids);
  const n=contacts.filter(x=>!idSet.has(x.id)&&x.reportsTo&&idSet.has(x.reportsTo)).length;
  return n?('\n\n'+n+' '+(n===1?'person reports':'people report')+' to '+(ids.length===1?'them':'these entries')+' — they’ll re-link to the next manager up.'):'';
}
function deletePerson(){
  const id=document.getElementById('f-id').value;
  if(!id)return;
  const c=byId(id);
  if(!confirm('Delete '+(c?c.name:'this person')+'?'+deleteMsg([id])))return;
  removeContacts([id]);
  closeSheet('fscrim');render();
  toast('Deleted');
}
function quickDelete(id){
  const c=byId(id);if(!c)return;
  if(!confirm('Delete '+c.name+'?'+deleteMsg([id])))return;
  removeContacts([id]);
  render();
  toast('Deleted '+c.name);
}

/* ---------- manage / bulk / dedupe ---------- */
function toggleManage(){
  manage=!manage;
  if(!manage)selected=new Set();
  const b=document.getElementById('manage-btn');
  b.textContent=manage?'Done':'Manage';
  b.classList.toggle('on',manage);
  render();
}
function togglePick(id,on){
  if(on)selected.add(id);else selected.delete(id);
  updateBulkbar();
}
function updateBulkbar(){
  const bar=document.getElementById('bulkbar');
  const show=screen==='people'&&manage&&selected.size>0;
  bar.classList.toggle('show',show);
  if(show)document.getElementById('bcount').textContent=selected.size+' selected';
}
function clearSelection(){
  selected=new Set();
  render();
}
function bulkDelete(){
  if(!selected.size)return;
  const ids=[...selected];
  if(!confirm('Delete '+ids.length+' '+(ids.length===1?'contact':'contacts')+'?'+deleteMsg(ids)))return;
  removeContacts(ids);
  render();
  toast('Deleted '+ids.length);
}
function dedupe(){
  const groups={};
  contacts.forEach(c=>{
    const k=(c.name||'').trim().toLowerCase().replace(/\s+/g,' ');
    if(!k)return;
    (groups[k]=groups[k]||[]).push(c);
  });
  const dupGroups=Object.values(groups).filter(g=>g.length>1);
  if(!dupGroups.length)return toast('No duplicate names found');
  const managers=new Set(contacts.map(c=>c.reportsTo).filter(Boolean));
  const FIELDS=['role','email','phone','location','function','notes'];
  const score=c=>FIELDS.reduce((n,k)=>n+(c[k]?1:0),0)+(managers.has(c.id)?10:0);
  const dupCount=dupGroups.reduce((n,g)=>n+g.length-1,0);
  if(!confirm('Found '+dupCount+' duplicate '+(dupCount===1?'entry':'entries')+' across '+dupGroups.length+' '+(dupGroups.length===1?'name':'names')+'.\n\nKeep the most complete record for each, merge in any missing details, and re-link their reports?'))return;
  const toRemove=[];const remap={};
  dupGroups.forEach(g=>{
    g.sort((a,b)=>score(b)-score(a));
    const keep=g[0];
    g.slice(1).forEach(d=>{
      toRemove.push(d.id);remap[d.id]=keep.id;
      FIELDS.forEach(k=>{if(!keep[k]&&d[k])keep[k]=d[k];});
      if(!keep.reportsTo&&d.reportsTo)keep.reportsTo=d.reportsTo;
    });
  });
  contacts.forEach(c=>{
    let t=c.reportsTo;const seen=new Set();
    while(t&&remap[t]&&!seen.has(t)){seen.add(t);t=remap[t];}
    c.reportsTo=(t===c.id)?'':t;
  });
  removeContacts(toRemove);
  render();
  toast('Removed '+toRemove.length+' '+(toRemove.length===1?'duplicate':'duplicates'));
}

/* ---------- org export / import ---------- */
function exportOrgJSON(){
  if(!contacts.length)return toast('Nothing to export');
  download('org-chart-'+stamp()+'.json',JSON.stringify(contacts,null,2),'application/json');
  toast('Exported JSON');
}
function exportOrgCSV(){
  if(!contacts.length)return toast('Nothing to export');
  const head=['Name','Role','Email','Phone','Location','Function','Reports To','Notes'];
  const rows=contacts.map(c=>[c.name,c.role,c.email,c.phone,c.location,c.function,nameOf(c.reportsTo),c.notes].map(csvCell).join(','));
  download('org-chart-'+stamp()+'.csv',head.join(',')+'\n'+rows.join('\n'),'text/csv');
  toast('Exported CSV');
}
function importOrgJSON(ev){
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const arr=JSON.parse(reader.result);
      if(!Array.isArray(arr))throw new Error('Not a list');
      const cleaned=arr.filter(x=>x&&x.name).map(x=>({
        id:x.id||uid(),name:String(x.name),role:x.role||'',email:x.email||'',phone:x.phone||'',
        location:x.location||'',function:x.function||'',reportsTo:x.reportsTo||'',notes:x.notes||''
      }));
      if(!cleaned.length)return toast('No valid contacts in file');
      const replace=contacts.length?confirm('Replace your current '+contacts.length+' contacts?\n\nOK = replace everything · Cancel = add to existing'):true;
      if(replace)contacts=cleaned;
      else{
        const existing=new Set(contacts.map(c=>c.id));
        cleaned.forEach(c=>{if(existing.has(c.id))c.id=uid();contacts.push(c);});
      }
      saveOrg();render();
      toast('Imported '+cleaned.length+' contacts');
    }catch(e){toast('Could not read that file');}
    ev.target.value='';
  };
  reader.readAsText(file);
}

/* ---------- init ---------- */
load();render();
