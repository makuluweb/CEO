<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stakeholder Map v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1713;
    --muted:#6d675d;
    --faint:#a39c8f;
    --paper:#f0ede6;
    --surface:#fdfcf9;
    --line:#ded8cb;
    --accent:#1f3bb3;
    --accent-soft:#e7eaf8;
    --accent-border:#bcc6ee;
    --rail:#cfc8b9;
    --danger:#a04b2c;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --radius:12px;
    --tap:44px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,textarea{font-family:inherit;font-size:16px}
  .mono{font-family:var(--mono)}
  .serif{font-family:var(--serif)}

  /* ---------- Masthead ---------- */
  header{
    position:sticky;top:0;z-index:30;background:rgba(240,237,230,.92);
    backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 14px) 16px 0;
  }
  .overline{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .titlebar{display:flex;align-items:center;gap:10px;padding-bottom:10px}
  .backbtn{flex:none;width:34px;height:34px;border-radius:9px;display:none;align-items:center;justify-content:center;color:var(--ink);margin-left:-6px}
  .backbtn.show{display:flex}
  h1{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.15;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:none}
  .menubtn{flex:none;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .menubtn:active{background:var(--line)}
  .tabs{display:flex;gap:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{
    flex:0 0 auto;min-height:38px;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    font-weight:700;color:var(--faint);position:relative;padding:0 1px;
  }
  .tabs button[aria-selected="true"]{color:var(--ink)}
  .tabs button[aria-selected="true"]::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}

  main{padding:14px 16px calc(120px + var(--safe-b))}
  #app{animation:pageIn .22s ease both}
  @keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#app{animation:none}}

  /* ---------- Shared surfaces ---------- */
  .sheet-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 0 rgba(26,23,19,.05)}
  .empty{text-align:center;padding:46px 24px;color:var(--muted)}
  .empty h2{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);margin:0 0 6px}
  .empty p{margin:0;font-size:14px;max-width:290px;margin-inline:auto}
  .miss{color:var(--faint);font-style:italic}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

  /* ---------- Agenda ---------- */
  .sbo-group{margin-bottom:28px}
  .sbo-head{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;margin:0 2px 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .sbo-head .no{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.12em}
  .aip-head{border-left:2px solid var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:14px 2px 8px;padding:1px 0 1px 10px}
  .prog{padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .prog .body{flex:1;min-width:0}
  .prog .nm{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.01em}
  .prog .meta{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:5px}
  .prog .go{flex:none;color:var(--faint)}
  .prog:active{background:#f7f4ee}

  /* ---------- Context card ---------- */
  .ctx{padding:13px 15px;margin-bottom:14px}
  .ctx .path{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .ctx .path b{color:var(--accent);font-weight:600}
  .ctx .nm{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .ctx .nm .edit{margin-left:auto;flex:none;color:var(--accent);font-size:13px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:32px}
  .ctx .notes{font-size:13px;color:var(--muted);margin-top:6px}
  .ctx .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
  .rline{margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rline span{color:var(--muted)}

  /* ---------- Chips & badges ---------- */
  .stage,.status,.stance{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);background:var(--surface);
  }
  .stage.propose,.status.doing{border-color:var(--accent);color:var(--accent)}
  .stage.won,.status.done{background:var(--ink);border-color:var(--ink);color:#fff}
  .stage.lost{color:var(--faint)}
  button.status,button.stage{min-height:28px}
  .badge{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
  .pchip{
    font-size:12.5px;font-weight:600;background:var(--surface);color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:5px 11px;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ---------- Tiers ---------- */
  .tier{margin-bottom:16px}
  .tier-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
  .tier-head .t{font-family:var(--serif);font-size:16.5px;font-weight:600}
  .tier-head .n{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint)}
  .tier-rail{border-left:2px solid var(--line);padding-left:10px}
  .tier.t1 .tier-rail{border-left-color:var(--ink)}
  .tier.t2 .tier-rail{border-left-color:var(--accent)}
  .tier.t3 .tier-rail{border-left-color:#8f8778}
  .stk{padding:9px 11px;margin-bottom:8px;display:flex;align-items:center;gap:10px;min-height:var(--tap)}
  .stk:active{background:#f7f4ee}
  .stk .pav{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .stk .body{flex:1;min-width:0}
  .stk .nm{font-weight:640;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stk .rl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Grid ---------- */
  .axis{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .axis-x{display:flex;justify-content:space-between;padding:0 2px;margin:6px 0 2px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
  .quad{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;min-height:128px}
  .quad.hot{background:var(--accent-soft);border-color:var(--accent-border)}
  .quad .qt{font-family:var(--serif);font-size:15.5px;font-weight:600}
  .quad .qs{font-size:11px;color:var(--muted);margin:1px 0 8px}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px}
  .quad-guide{margin-top:14px;font-size:12.5px;color:var(--muted)}
  .quad-guide b{font-family:var(--serif);color:var(--ink);font-weight:600}
  .quad-guide p{margin:0 0 5px}

  /* ---------- Plan ---------- */
  .plan{padding:12px 14px;margin-bottom:10px}
  .plan .top{display:flex;align-items:center;gap:8px}
  .plan .nm{font-weight:650;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plan .msg{font-size:13.5px;margin-top:7px}
  .plan .msg .lbl,.plan .act .lbl{display:block;margin-bottom:1px}
  .plan .act{font-size:13.5px;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
  .plan .act>div{min-width:120px;flex:1}

  /* ---------- Pursuits ---------- */
  .pur{padding:12px 14px;margin-bottom:10px}
  .pur .top{display:flex;align-items:center;gap:8px}
  .pur .nm{font-family:var(--serif);font-size:17px;font-weight:600;flex:1;min-width:0}
  .pur .val{font-size:13px;color:var(--muted);margin-top:3px}
  .pur .sum{font-size:13.5px;margin-top:7px}
  .pur .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px}
  .pur .side{min-width:0}
  .pur .side .h{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
  .pur:active{background:#f7f4ee}

  /* ---------- People ---------- */
  .searchrow{display:flex;gap:8px;margin-bottom:14px}
  .searchwrap{position:relative;flex:1}
  .searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .search{width:100%;min-height:var(--tap);padding:0 14px 0 38px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
  .search:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .pcard{padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;min-height:60px}
  .pcard:active{background:#f7f4ee}
  .avatar{flex:none;width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
  .pcard .who{flex:1;min-width:0}
  .pcard .nm{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .rl{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .fp{flex:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:right}
  .pcard .fp b{display:block;font-size:14px;color:var(--accent)}

  .tbtn{
    flex:1;min-width:120px;min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;
  }
  .tbtn:active{background:var(--paper)}
  .tbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tbtn svg{width:14px;height:14px}
  .toolbar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-top:8px;text-align:center}

  /* Manage mode */
  .listrow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;min-height:var(--tap)}
  .listrow .pick{flex:none;width:22px;height:22px;accent-color:var(--accent)}
  .listrow .info{flex:1;min-width:0}
  .listrow .nm{font-weight:640;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listrow .rl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icobtn{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .icobtn:active{background:var(--paper)}
  .icobtn.trash{color:var(--danger);border-color:#d8c2b4}
  .icobtn svg{width:17px;height:17px}
  .bulkbar{
    position:fixed;left:16px;right:16px;bottom:calc(86px + var(--safe-b));z-index:45;
    background:var(--ink);color:#fff;border-radius:13px;display:none;align-items:center;gap:10px;
    padding:10px 12px;box-shadow:0 8px 24px rgba(26,23,19,.28);
  }
  .bulkbar.show{display:flex}
  .bulkbar .bcount{flex:1;font-size:14px;font-weight:600}
  .bulkbar button{min-height:38px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600}
  .bulkbar .bdel{background:#fff;color:var(--danger)}
  .bulkbar .bcancel{color:#d8d2c6}

  /* Org tree */
  .node .row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;min-height:var(--tap)}
  .node .row:active{background:#f7f4ee}
  .twist{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--paper)}
  .twist.leaf{visibility:hidden}
  .twist svg{transition:transform .18s ease}
  .node.collapsed > .row .twist svg{transform:rotate(-90deg)}
  .node-body{flex:1;min-width:0}
  .node-body .nm{font-weight:640;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node-body .rl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node-count{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:600}
  .children{margin-left:18px;padding-left:14px;border-left:1.5px solid var(--rail)}
  .node.collapsed > .children{display:none}
  @media (prefers-reduced-motion:reduce){.twist svg{transition:none}}
  .roots-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:4px 2px 8px}

  /* ---------- Person profile ---------- */
  .profile-head{padding:16px;margin-bottom:12px}
  .profile-head .toprow{display:flex;gap:13px;align-items:center}
  .profile-head .avatar{width:52px;height:52px;font-size:17px;border-radius:12px}
  .profile-head .nm{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
  .profile-head .rl{font-size:13.5px;color:var(--muted);margin-top:2px}
  .profile-head .tagsrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .ptag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
  .profile-actions{display:flex;gap:8px;margin-top:12px}
  .pact{
    flex:1;min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
    font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-decoration:none;
  }
  .pact svg{width:15px;height:15px;color:var(--muted)}
  .pact:active{background:var(--paper)}
  .fp-section{margin-bottom:18px}
  .fp-h{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 2px 8px;display:flex;align-items:baseline;gap:8px}
  .fp-h .n{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em}
  .fp-item{padding:11px 13px;margin-bottom:8px}
  .fp-item:active{background:#f7f4ee}
  .fp-item .where{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
  .fp-item .toprow{display:flex;align-items:center;gap:8px}
  .fp-item .t{font-family:var(--serif);font-size:15.5px;font-weight:600;flex:1;min-width:0}
  .fp-item .detail{font-size:13px;color:var(--muted);margin-top:5px}
  .fp-item .detail b{color:var(--ink);font-weight:600}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:40;height:54px;padding:0 20px 0 17px;
    border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:640;
    display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(31,59,179,.32);
  }
  .fab:active{transform:translateY(1px)}
  .fab svg{width:20px;height:20px}
  .fab.hide{display:none}

  /* ---------- Sheets ---------- */
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(26,23,19,.42);display:none;align-items:flex-end;justify-content:center}
  .scrim.open{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:rise .24s cubic-bezier(.2,.8,.2,1)}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:18px 18px 0 0;z-index:2}
  .sheet-head h3{margin:0;font-family:var(--serif);font-size:18px;font-weight:600}
  .sheet-head button{font-size:15px;color:var(--accent);font-weight:600;min-height:36px;padding:0 4px}
  .sheet-head button.del{color:var(--danger)}
  .sheet-body{overflow-y:auto;padding:14px 16px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
  .field{margin-bottom:14px}
  .field>label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
  .field input,.field textarea{width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  .field textarea{min-height:76px;resize:vertical;line-height:1.4}
  .field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips button{
    min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
    font-size:13px;font-weight:560;color:var(--muted);
  }
  .chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .chips.accent button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
  .suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .suggest button{
    min-height:28px;padding:0 10px;border:1px dashed var(--line);border-radius:999px;background:none;
    font-size:12px;color:var(--muted);
  }
  .suggest button:active{background:var(--paper)}
  .pickerfield{
    width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
    display:flex;align-items:center;gap:8px;font-size:16px;text-align:left;
  }
  .pickerfield .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pickerfield .v.placeholder{color:var(--faint)}
  .pickerfield svg{flex:none;color:var(--faint)}
  .save{width:100%;min-height:50px;background:var(--accent);color:#fff;border-radius:12px;font-size:16px;font-weight:640;margin-top:6px}
  .save:active{transform:translateY(1px)}
  .save:disabled{opacity:.45}
  .req{color:var(--danger)}

  /* Picker sheet */
  .picker-search{position:sticky;top:0;background:var(--surface);padding:2px 0 10px;z-index:2}
  .pickrow{display:flex;align-items:center;gap:11px;padding:9px 4px;min-height:52px;border-bottom:1px solid var(--line);width:100%;text-align:left}
  .pickrow:active{background:var(--paper)}
  .pickrow .avatar{width:36px;height:36px;font-size:12px;border-radius:9px}
  .pickrow .who{flex:1;min-width:0}
  .pickrow .nm{font-weight:640;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pickrow .rl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pickrow.free .avatar{background:var(--paper);color:var(--muted);border:1px dashed var(--line)}

  /* ---------- Dialog ---------- */
  .dscrim{position:fixed;inset:0;z-index:70;background:rgba(26,23,19,.46);display:none;align-items:center;justify-content:center;padding:24px}
  .dscrim.open{display:flex}
  .dialog{width:100%;max-width:340px;background:var(--surface);border-radius:16px;padding:20px 18px 14px;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.dialog{animation:none}}
  .dialog h4{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .dialog p{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.5;white-space:pre-line}
  .dialog .dbtns{display:flex;flex-direction:column;gap:8px}
  .dialog .dbtns button{
    min-height:44px;border-radius:10px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  }
  .dialog .dbtns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .dialog .dbtns button.danger{color:var(--danger);border-color:#d8c2b4}
  .dialog .dbtns button.quiet{border:none;color:var(--muted);min-height:38px}
  .dialog .dbtns button:active{transform:translateY(1px)}

  .toast{
    position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:550;padding:10px 16px;border-radius:11px;
    z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="overline">Stakeholder Map · Account Intelligence</div>
  <div class="titlebar">
    <button class="backbtn" id="backbtn" onclick="pop()" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">The Agenda</h1>
    <span class="count" id="count"></span>
    <button class="menubtn" id="menubtn" onclick="openMenu()" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </button>
  </div>
  <div class="tabs" id="tabbar"></div>
</header>

<main><div id="app"></div></main>

<button class="fab" id="fab" onclick="fabTap()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span id="fab-label">Program</span>
</button>

<div class="bulkbar" id="bulkbar">
  <span class="bcount" id="bcount"></span>
  <button class="bcancel" onclick="clearSelection()">Clear</button>
  <button class="bdel" onclick="bulkDelete()">Delete</button>
</div>

<!-- generic form sheet (content injected) -->
<div class="scrim" id="fscrim" onclick="if(event.target===this)closeForm()">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <button id="form-del" class="del" style="visibility:hidden" onclick="formDelete()">Delete</button>
      <h3 id="form-title"></h3>
      <button onclick="closeForm()">Done</button>
    </div>
    <div class="sheet-body" id="form-body"></div>
  </div>
</div>

<!-- person / member picker sheet -->
<div class="scrim" id="kscrim" onclick="if(event.target===this)pickerCancel()">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <span style="width:44px"></span>
      <h3 id="picker-title">Choose person</h3>
      <button onclick="pickerCancel()">Cancel</button>
    </div>
    <div class="sheet-body">
      <div class="picker-search">
        <input class="search" id="picker-q" type="search" placeholder="Search…" autocomplete="off" oninput="pickerFilter()" style="padding-left:14px">
      </div>
      <div id="picker-list"></div>
    </div>
  </div>
</div>

<!-- dialog -->
<div class="dscrim" id="dscrim">
  <div class="dialog">
    <h4 id="d-title"></h4>
    <p id="d-msg"></p>
    <div class="dbtns" id="d-btns"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Stakeholder Map v3 — data lives only in this browser's
   local storage. Nothing is transmitted anywhere.
   ============================================================ */
const KEY_MAP='stakemap_v1';
const KEY_ORG='orgchart_contacts_v1';
let data={programs:[]};
let contacts=[];
let manage=false;
let selected=new Set();
let collapsed={};
let dirSearch='';

const TIERS=['Senior Ownership','Business Value Owner','Delivery Team','Influencer'];
const RACI={A:'Accountable',R:'Responsible',C:'Consulted',I:'Informed'};
const RACI_KEYS=['A','R','C','I'];
const STAGES=['Identify','Qualify','Propose','Won','Lost'];
const STANCES=['Champion','Supportive','Neutral','Sceptical','Blocker'];
const LEVELS=['High','Medium','Low'];
const STATUSES=['Not started','In progress','Done'];
const SBO_ORDER=['Copper Growth','Operating Excellence','Project Excellence','Technology','Social Value & Sustainability'];
const QNAMES=['Manage closely','Keep satisfied','Keep informed','Monitor'];

/* ---------- storage & helpers ---------- */
function load(){
  try{const r=localStorage.getItem(KEY_MAP);data=r?JSON.parse(r):{programs:[]};}catch(e){data={programs:[]};}
  if(!data||!Array.isArray(data.programs))data={programs:[]};
  data.programs.forEach(p=>{
    if(!Array.isArray(p.stakeholders))p.stakeholders=[];
    if(!Array.isArray(p.pursuits))p.pursuits=[];
    p.pursuits.forEach(u=>{if(!Array.isArray(u.members))u.members=[];});
  });
  try{const c=localStorage.getItem(KEY_ORG);contacts=c?JSON.parse(c):[];}catch(e){contacts=[];}
  if(!Array.isArray(contacts))contacts=[];
}
function saveMap(){try{localStorage.setItem(KEY_MAP,JSON.stringify(data));}catch(e){toast('Could not save — storage full or blocked');}}
function saveOrg(){try{localStorage.setItem(KEY_ORG,JSON.stringify(contacts));}catch(e){toast('Could not save — storage full or blocked');}}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function byId(id){return contacts.find(c=>c.id===id);}
function nameOf(id){const c=byId(id);return c?c.name:'';}
function initials(name){
  const p=(name||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length)return '?';
  if(p.length===1)return p[0].slice(0,2).toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}
function download(filename,text,type){
  const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function stamp(){return new Date().toISOString().slice(0,10);}
function csvCell(v){v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function slugify(s){return (s||'item').replace(/[^\w-]+/g,'-').toLowerCase();}

/* ---------- navigation stack ---------- */
let stack=[{screen:'root',tab:'agenda',scroll:0}];
function topFrame(){return stack[stack.length-1];}
function push(frame){
  topFrame().scroll=window.scrollY;
  stack.push(frame);
  render();window.scrollTo(0,0);
}
function pop(){
  if(stack.length<=1)return;
  stack.pop();
  render();
  const y=topFrame().scroll||0;
  requestAnimationFrame(()=>window.scrollTo(0,y));
}
function goRoot(){
  stack=[{screen:'root',tab:'agenda',scroll:0}];
  render();window.scrollTo(0,0);
}
function setTab(t){
  const f=topFrame();
  f.tab=t;
  if(f.screen==='root'&&t!=='directory'&&manage){manage=false;selected=new Set();}
  render();
}
function rerender(){const y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y));}

/* resolve current entities from frame */
function curProgram(){const f=topFrame();return data.programs.find(p=>p.id===f.programId);}
function curPursuit(){const p=curProgram();const f=topFrame();return p?p.pursuits.find(u=>u.id===f.pursuitId):null;}
function curContact(){return byId(topFrame().contactId);}

/* ---------- dialogs ---------- */
let dialogResolve=null;
function showDialog(opts){
  return new Promise(res=>{
    dialogResolve=res;
    document.getElementById('d-title').textContent=opts.title||'';
    document.getElementById('d-msg').textContent=opts.message||'';
    document.getElementById('d-msg').style.display=opts.message?'':'none';
    document.getElementById('d-btns').innerHTML=opts.buttons.map((b,i)=>
      `<button class="${b.style||''}" onclick="dialogPick(${i})">${esc(b.label)}</button>`
    ).join('');
    document.getElementById('dscrim')._buttons=opts.buttons;
    document.getElementById('dscrim').classList.add('open');
  });
}
function dialogPick(i){
  const b=document.getElementById('dscrim')._buttons[i];
  document.getElementById('dscrim').classList.remove('open');
  const r=dialogResolve;dialogResolve=null;
  if(r)r(b.value);
}
function confirmDialog(title,message,confirmLabel,danger){
  return showDialog({title,message,buttons:[
    {label:confirmLabel,style:danger?'danger':'primary',value:true},
    {label:'Cancel',style:'quiet',value:false}
  ]});
}
function actionSheet(title,options,current){
  return showDialog({title,message:'',buttons:options.map(o=>({label:o+(o===current?'  ·':''),style:o===current?'primary':'',value:o})).concat([{label:'Cancel',style:'quiet',value:null}])});
}

/* ---------- person picker ---------- */
let pickerResolve=null;let pickerOpts={};
function openPersonPicker(opts){
  pickerOpts=opts||{};
  document.getElementById('picker-title').textContent=pickerOpts.title||'Choose person';
  document.getElementById('picker-q').value='';
  renderPickerList('');
  document.getElementById('kscrim').classList.add('open');
  return new Promise(res=>{pickerResolve=res;});
}
function pickerSource(){
  if(pickerOpts.source)return pickerOpts.source;
  return contacts.map(c=>({key:'c:'+c.id,name:c.name,sub:[c.role,c.function].filter(Boolean).join(' · '),payload:{type:'contact',contact:c}}));
}
function renderPickerList(q){
  q=(q||'').toLowerCase().trim();
  let rows=pickerSource();
  const ex=new Set(pickerOpts.exclude||[]);
  rows=rows.filter(r=>!ex.has(r.key));
  if(q)rows=rows.filter(r=>(r.name+' '+(r.sub||'')).toLowerCase().includes(q));
  rows.sort((a,b)=>a.name.localeCompare(b.name));
  let html=rows.slice(0,80).map((r,i)=>`<button class="pickrow" onclick="pickerChoose(${i})">
    <span class="avatar">${esc(initials(r.name))}</span>
    <span class="who"><span class="nm" style="display:block">${esc(r.name)}</span>${r.sub?`<span class="rl" style="display:block">${esc(r.sub)}</span>`:''}</span>
  </button>`).join('');
  document.getElementById('picker-list')._rows=rows.slice(0,80);
  if(pickerOpts.allowFree&&q){
    html+=`<button class="pickrow free" onclick="pickerFree()">
      <span class="avatar">+</span>
      <span class="who"><span class="nm" style="display:block">Use “${esc(document.getElementById('picker-q').value.trim())}”</span><span class="rl" style="display:block">Not in the directory — free text</span></span>
    </button>`;
  }
  if(pickerOpts.allowClear){
    html=`<button class="pickrow free" onclick="pickerClear()">
      <span class="avatar">—</span>
      <span class="who"><span class="nm" style="display:block">${esc(pickerOpts.clearLabel||'None')}</span></span>
    </button>`+html;
  }
  if(!rows.length&&!q&&pickerOpts.emptyHint){
    html=`<div class="empty"><p>${esc(pickerOpts.emptyHint)}</p></div>`+html;
  }
  document.getElementById('picker-list').innerHTML=html;
}
function pickerFilter(){renderPickerList(document.getElementById('picker-q').value);}
function pickerChoose(i){
  const r=document.getElementById('picker-list')._rows[i];
  document.getElementById('kscrim').classList.remove('open');
  const res=pickerResolve;pickerResolve=null;
  if(res)res(r.payload);
}
function pickerFree(){
  const name=document.getElementById('picker-q').value.trim();
  document.getElementById('kscrim').classList.remove('open');
  const res=pickerResolve;pickerResolve=null;
  if(res)res({type:'free',name});
}
function pickerClear(){
  document.getElementById('kscrim').classList.remove('open');
  const res=pickerResolve;pickerResolve=null;
  if(res)res({type:'clear'});
}
function pickerCancel(){
  document.getElementById('kscrim').classList.remove('open');
  const res=pickerResolve;pickerResolve=null;
  if(res)res(null);
}

/* ---------- footprint ---------- */
function footprint(contact){
  const key=(contact.name||'').trim().toLowerCase();
  const progHits=[];const purHits=[];const roleHits=[];
  data.programs.forEach(p=>{
    p.stakeholders.forEach(s=>{
      const match=s.contactId===contact.id||(s.name||'').trim().toLowerCase()===key;
      if(!match)return;
      progHits.push({p,s});
      p.pursuits.forEach(u=>(u.members||[]).forEach(m=>{if(m.ref===s.id)purHits.push({p,u,s,m});}));
    });
    p.pursuits.forEach(u=>{
      ['bhpSponsor','bhpOwner'].forEach(f=>{
        if((u[f]||'').trim().toLowerCase()===key)roleHits.push({p,u,role:f==='bhpSponsor'?'BHP sponsor':'BHP owner'});
      });
    });
  });
  return {progHits,purHits,roleHits};
}
function footprintCount(contact){
  const f=footprint(contact);
  return f.progHits.length+f.purHits.length;
}

/* ---------- header / chrome ---------- */
const TABSETS={
  root:[['agenda','The Agenda'],['directory','Directory'],['chart','Org chart']],
  program:[['tiers','Tiers'],['grid','Grid'],['plan','Plan'],['pursuits','Pursuits']],
  pursuit:[['grid','Grid'],['plan','Plan']],
  person:null
};
function render(){
  const f=topFrame();
  const tabs=TABSETS[f.screen];
  document.getElementById('backbtn').classList.toggle('show',stack.length>1);
  const tb=document.getElementById('tabbar');
  if(tabs){
    tb.style.display='flex';
    tb.innerHTML=tabs.map(([k,l])=>`<button aria-selected="${f.tab===k}" onclick="setTab('${k}')">${l}</button>`).join('');
  }else{tb.style.display='none';tb.innerHTML='';}

  let title='',count='',fabLabel=null;
  const app=document.getElementById('app');
  if(f.screen==='root'){
    if(f.tab==='agenda'){
      title='The Agenda';
      count=data.programs.length?data.programs.length+' prog':'';
      fabLabel='Program';
      app.innerHTML=renderAgenda();
    }else{
      title='People';count=contacts.length+' ppl';
      fabLabel='Person';
      app.innerHTML=renderPeople(f.tab);
    }
  }else if(f.screen==='program'){
    const p=curProgram();
    if(!p){stack.pop();render();return;}
    title=p.name;count=p.stakeholders.length+' stk';
    fabLabel=f.tab==='pursuits'?'Pursuit':'Stakeholder';
    app.innerHTML=renderProgram(p,f.tab);
  }else if(f.screen==='pursuit'){
    const u=curPursuit();
    if(!u){stack.pop();render();return;}
    title=u.name;count=(u.members||[]).length+' stk';
    fabLabel='Stakeholder';
    app.innerHTML=renderPursuit(curProgram(),u,f.tab);
  }else if(f.screen==='person'){
    const c=curContact();
    if(!c){stack.pop();render();return;}
    title=c.name;count='';fabLabel=null;
    app.innerHTML=renderPerson(c);
  }
  document.getElementById('title').textContent=title;
  document.getElementById('count').textContent=count;
  const fab=document.getElementById('fab');
  fab.classList.toggle('hide',!fabLabel);
  if(fabLabel)document.getElementById('fab-label').textContent=fabLabel;
  updateBulkbar();
}
function fabTap(){
  const f=topFrame();
  if(f.screen==='root')return f.tab==='agenda'?openProgramForm():openPersonForm();
  if(f.screen==='program')return f.tab==='pursuits'?openPursuitForm():openStakeholderForm();
  if(f.screen==='pursuit')return addPursuitMember();
}
function goPrograms(){goRoot();}
function goPeople(){goRoot();topFrame().tab='directory';render();}

/* ---------- overflow menu ---------- */
async function openMenu(){
  const f=topFrame();
  let buttons=[];
  if(f.screen==='root'&&f.tab!=='agenda'){
    buttons=[
      {label:'Export people (JSON)',value:'orgjson'},
      {label:'Export people (CSV)',value:'orgcsv'},
      {label:'Import people (JSON)',value:'orgimport'},
      {label:'Clean up duplicates',value:'dedupe'},
      {label:'Export programs (JSON)',value:'mapjson'},
    ];
  }else{
    buttons=[
      {label:'Export programs (JSON)',value:'mapjson'},
      {label:'Import programs (JSON)',value:'mapimport'},
      {label:'Export people (JSON)',value:'orgjson'},
    ];
  }
  buttons.push({label:'Cancel',style:'quiet',value:null});
  const v=await showDialog({title:'Menu',message:'',buttons});
  if(v==='orgjson')exportOrgJSON();
  else if(v==='orgcsv')exportOrgCSV();
  else if(v==='orgimport')fileInput(importOrgJSON);
  else if(v==='dedupe')dedupe();
  else if(v==='mapjson')exportMap();
  else if(v==='mapimport')fileInput(importMap);
}
function fileInput(handler){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/json,.json';
  inp.onchange=e=>{const file=e.target.files[0];if(file)handler(file);};
  inp.click();
}

/* ============================================================
   SCREEN: The Agenda
   ============================================================ */
function renderAgenda(){
  if(!data.programs.length){
    return `<div class="empty"><h2>No programs yet</h2><p>Add a program and anchor it to its Strategic Business Objective and AIP. Then map the stakeholders who decide whether it succeeds.</p></div>
    <div class="toolbar"><button class="tbtn" onclick="goPeople()">Go to People</button></div>`;
  }
  const bySbo={};
  data.programs.forEach(p=>{
    const s=p.sbo||'(No SBO)';const a=p.aip||'(No AIP)';
    bySbo[s]=bySbo[s]||{};bySbo[s][a]=bySbo[s][a]||[];bySbo[s][a].push(p);
  });
  const keys=Object.keys(bySbo).sort((a,b)=>{
    const ia=SBO_ORDER.indexOf(a),ib=SBO_ORDER.indexOf(b);
    if(ia!==-1&&ib!==-1)return ia-ib;
    if(ia!==-1)return -1;
    if(ib!==-1)return 1;
    return a.localeCompare(b);
  });
  let html='';
  keys.forEach((s,si)=>{
    html+=`<div class="sbo-group"><div class="sbo-head"><span class="no">${String(si+1).padStart(2,'0')}</span>${esc(s)}</div>`;
    Object.keys(bySbo[s]).sort().forEach(a=>{
      html+=`<div class="aip-head">${esc(a)}</div>`;
      bySbo[s][a].forEach(p=>{
        const open=p.stakeholders.filter(x=>x.action&&x.status!=='Done').length;
        const meta=[p.stakeholders.length+' stk'];
        if(p.pursuits.length)meta.push(p.pursuits.length+' pursuits');
        if(open)meta.push(open+' open');
        html+=`<div class="prog sheet-card" onclick="openProgramScreen('${p.id}')">
          <div class="body"><div class="nm">${esc(p.name)}</div><div class="meta">${meta.join(' · ')}</div></div>
          <svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>`;
      });
    });
    html+='</div>';
  });
  return html;
}
function openProgramScreen(id){push({screen:'program',programId:id,tab:'tiers',scroll:0});}

/* ============================================================
   SCREEN: Program
   ============================================================ */
function renderProgram(p,tab){
  const ctx=`<div class="ctx sheet-card">
    <div class="path"><b>${esc(p.sbo)}</b> › ${esc(p.aip)}</div>
    <div class="nm">${esc(p.name)}<button class="edit" onclick="openProgramForm('${p.id}')">Edit</button></div>
    ${p.notes?`<div class="notes">${esc(p.notes)}</div>`:''}
  </div>`;
  let body='';
  if(tab==='pursuits')body=renderPursuitList(p);
  else if(!p.stakeholders.length)body=`<div class="empty"><h2>No stakeholders mapped</h2><p>Add the people who own, fund, deliver and influence this program — accountable and interested alike.</p></div>`;
  else if(tab==='tiers')body=renderTiers(p);
  else if(tab==='grid')body=renderGridView(p.stakeholders.map(s=>({s,edit:`openStakeholderForm('${s.id}')`})),true);
  else body=renderPlanList(p);
  return ctx+body;
}
function renderTiers(p){
  let html='';
  TIERS.forEach((t,i)=>{
    const list=p.stakeholders.filter(s=>s.tier===t);
    if(!list.length)return;
    html+=`<div class="tier t${i+1}"><div class="tier-head"><span class="t">${esc(t)}</span><span class="n">${list.length}</span></div><div class="tier-rail">`;
    list.forEach(s=>{
      html+=`<div class="stk sheet-card" onclick="openStakeholderForm('${s.id}')">

function quadrant(s){
  const hi=v=>v==='High';

}
function renderGridView(items,withGuide){

function cycleStatus(kind,id){
  let obj=null;

  if(kind==='m'){const u=curPursuit();if(u)obj=u.members.find(x=>x.id===id);}

  }

/* ---------- org tree ---------- */
function renderOrgTree(){
  if(!contacts.length)return `<div class="empty"><h2>Nothing to chart yet</h2><p>Add people and set who they report to.</p></div>`;
  const ids=new Set(contacts.map(c=>c.id));
  const kids={};
  contacts.forEach(c=>{kids[c.id]=[];});
  const roots=[];
  contacts.forEach(c=>{
    if(c.reportsTo && ids.has(c.reportsTo) && c.reportsTo!==c.id)kids[c.reportsTo].push(c);
    else roots.push(c);
  });
  const sortFn=(a,b)=>(a.name||'').localeCompare(b.name||'');
  roots.sort(sortFn);
  Object.values(kids).forEach(arr=>arr.sort(sortFn));
  const seen=new Set();
  function countDesc(id){
    let n=0;const stackA=[...(kids[id]||[])];const visited=new Set();
    while(stackA.length){const x=stackA.pop();if(visited.has(x.id))continue;visited.add(x.id);n++;stackA.push(...(kids[x.id]||[]));}
    return n;
  }
  function node(c){
    if(seen.has(c.id)){
      return `<div class="node"><div class="row"><span class="twist leaf"></span><div class="node-body"><div class="nm">${esc(c.name)}</div><div class="rl">↳ already shown above</div></div></div></div>`;
    }
    seen.add(c.id);
    const ch=kids[c.id]||[];
    const isCol=collapsed[c.id];
    const tw=ch.length
      ? `<button class="twist" onclick="toggleNode(event,'${c.id}')" aria-label="Toggle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>`
      : `<span class="twist leaf"></span>`;
    const cnt=ch.length?`<span class="node-count">${countDesc(c.id)}</span>`:'';
    const childHTML=ch.length?`<div class="children">${ch.map(node).join('')}</div>`:'';
    return `<div class="node${isCol?' collapsed':''}">
      <div class="row" onclick="openPersonScreen('${c.id}')">
        ${tw}
        <div class="node-body">
          <div class="nm">${esc(c.name)}</div>
          ${c.role?`<div class="rl">${esc(c.role)}</div>`:''}
        </div>
        ${cnt}
      </div>
      ${childHTML}
    </div>`;
  }
  const label=roots.length===contacts.length?'Everyone (no reporting links set)':'Top of chain';
  let out=`<div class="roots-label">${label}</div><div>${roots.map(node).join('')}</div>`;
  const unseen=contacts.filter(c=>!seen.has(c.id));
  if(unseen.length){
    out+=`<div class="roots-label" style="margin-top:14px">Circular reporting — fix “reports to”</div><div>${unseen.map(node).join('')}</div>`;
  }
  return out;
}
function toggleNode(ev,id){
  ev.stopPropagation();
  collapsed[id]=!collapsed[id];
  const area=document.getElementById('chart-area');
  if(area){const y=window.scrollY;area.innerHTML=renderOrgTree();window.scrollTo(0,y);}
}

        <div class="where">${esc(h.p.name)}</div>
        <div class="toprow"><span class="t">${esc(h.u.name)}</span><span class="stage ${stageCls(h.u.stage)}">${esc(h.u.stage)}</span></div>
        <div class="detail">${esc(RACI[h.m.raci]||'')} · <span class="status ${cls}" style="padding:2px 8px">${esc(st)}</span></div>
        ${h.m.message?`<div class="detail"><b>Message:</b> ${esc(h.m.message)}</div>`:''}
        ${h.m.action?`<div class="detail"><b>Next:</b> ${esc(h.m.action)}${h.m.owner?' — '+esc(h.m.owner):''}</div>`:''}
      </div>`;
    });
    html+='</div>';
  }
  if(fp.roleHits.length){
    html+=`<div class="fp-section"><div class="fp-h">Sponsorship roles <span class="n">${fp.roleHits.length}</span></div>`;
    fp.roleHits.forEach(h=>{
      html+=`<div class="fp-item sheet-card" onclick="jumpToPursuit('${h.p.id}','${h.u.id}')">
        <div class="where">${esc(h.p.name)}</div>
        <div class="toprow"><span class="t">${esc(h.u.name)}</span><span class="stage ${stageCls(h.u.stage)}">${esc(h.u.stage)}</span></div>
        <div class="detail">${esc(h.role)} on this pursuit</div>
      </div>`;
    });
    html+='</div>';
  }
  return html;
}

function openForm(title,bodyHTML,showDelete){

function chipGroup(id,options,value,labels,accent){
  return `<div class="chips${accent?' accent':''}" id="${id}">`+options.map(o=>{
    const lab=labels?labels[o]||o:o;
    return `<button aria-pressed="${o===value}" onclick="chipSet('${id}','${esc(o)}',this)">${esc(lab)}</button>`;
  }).join('')+`<input type="hidden" id="${id}-v" value="${esc(value)}"></div>`;

function chipSet(groupId,val,btn){

async function reportsPick(){
  const id=formCtx.id;
  const banned=new Set();
  if(id){
    banned.add(id);
    const kids={};contacts.forEach(c=>kids[c.id]=[]);
    contacts.forEach(c=>{if(c.reportsTo&&kids[c.reportsTo])kids[c.reportsTo].push(c.id);});
    const st=[id];while(st.length){const x=st.pop();(kids[x]||[]).forEach(k=>{if(!banned.has(k)){banned.add(k);st.push(k);}});}
  }
  const source=contacts.filter(c=>!banned.has(c.id)).map(c=>({key:'c:'+c.id,name:c.name,sub:c.role||'',payload:{type:'contact',contact:c}}));
  const res=await openPersonPicker({title:'Reports to',source,allowClear:true,clearLabel:'No one — top level'});
  if(!res)return;
  if(res.type==='clear'){formCtx.reportsTo='';setPickerField('cf-reports','','No one — top level');}
  else if(res.type==='contact'){formCtx.reportsTo=res.contact.id;setPickerField('cf-reports',res.contact.name,'No one — top level');}

function removeContacts(ids){
  const idSet=new Set(ids);
  const parentOf=id=>{const c=byId(id);return c?c.reportsTo:'';};
  const surviving=id=>{
    let p=parentOf(id);const seen=new Set();
    while(p&&idSet.has(p)&&!seen.has(p)){seen.add(p);p=parentOf(p);}
    return (p&&byId(p)&&!idSet.has(p))?p:'';
  };
  contacts.forEach(c=>{
    if(!idSet.has(c.id)&&c.reportsTo&&idSet.has(c.reportsTo))c.reportsTo=surviving(c.reportsTo);
  });
  contacts=contacts.filter(c=>!idSet.has(c.id));
  ids.forEach(id=>{delete collapsed[id];selected.delete(id);});
  saveOrg();
}
function reportsNote(ids){
  const idSet=new Set(ids);
  const n=contacts.filter(x=>!idSet.has(x.id)&&x.reportsTo&&idSet.has(x.reportsTo)).length;
  return n?('\n'+n+' '+(n===1?'person reports':'people report')+' to '+(ids.length===1?'them':'these entries')+' — they\u2019ll re-link to the next manager up.'):'';
}

async function dedupe(){
  const groups={};
  contacts.forEach(c=>{
    const k=(c.name||'').trim().toLowerCase().replace(/\s+/g,' ');
    if(!k)return;
    (groups[k]=groups[k]||[]).push(c);
  });
  const dupGroups=Object.values(groups).filter(g=>g.length>1);
  if(!dupGroups.length)return toast('No duplicate names found');
  const managers=new Set(contacts.map(c=>c.reportsTo).filter(Boolean));
  const FIELDS=['role','email','phone','location','function','notes'];
  const score=c=>FIELDS.reduce((n,k)=>n+(c[k]?1:0),0)+(managers.has(c.id)?10:0);
  const dupCount=dupGroups.reduce((n,g)=>n+g.length-1,0);
  const ok=await confirmDialog('Clean up duplicates',
    dupCount+' duplicate '+(dupCount===1?'entry':'entries')+' across '+dupGroups.length+' '+(dupGroups.length===1?'name':'names')+'.\nThe most complete record is kept, missing details merged in, reports re-linked.',
    'Clean up',false);
  if(!ok)return;
  const toRemove=[];const remap={};
  dupGroups.forEach(g=>{
    g.sort((a,b)=>score(b)-score(a));
    const keep=g[0];
    g.slice(1).forEach(d=>{
      toRemove.push(d.id);remap[d.id]=keep.id;
      FIELDS.forEach(k=>{if(!keep[k]&&d[k])keep[k]=d[k];});
      if(!keep.reportsTo&&d.reportsTo)keep.reportsTo=d.reportsTo;
    });
  });
  contacts.forEach(c=>{
    let t=c.reportsTo;const seen=new Set();
    while(t&&remap[t]&&!seen.has(t)){seen.add(t);t=remap[t];}
    c.reportsTo=(t===c.id)?'':t;
  });
  removeContacts(toRemove);
  rerender();
  toast('Removed '+toRemove.length+' '+(toRemove.length===1?'duplicate':'duplicates'));
}

function importOrgJSON(file){
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const arr=JSON.parse(reader.result);
      if(!Array.isArray(arr))throw new Error('bad');
      const cleaned=arr.filter(x=>x&&x.name).map(x=>({
        id:x.id||uid(),name:String(x.name),role:x.role||'',email:x.email||'',phone:x.phone||'',
        location:x.location||'',function:x.function||'',reportsTo:x.reportsTo||'',notes:x.notes||''
      }));
      if(!cleaned.length)return toast('No people found in that file');
      let mode='replace';
      if(contacts.length){
        mode=await showDialog({title:'Import '+cleaned.length+' people',
          message:'You currently have '+contacts.length+' people.',
          buttons:[
            {label:'Add to existing',style:'primary',value:'merge'},
            {label:'Replace all '+contacts.length,style:'danger',value:'replace'},
            {label:'Cancel',style:'quiet',value:null}
          ]});
        if(!mode)return;
      }
      if(mode==='replace')contacts=cleaned;
      else{
        const existing=new Set(contacts.map(c=>c.id));
        cleaned.forEach(c=>{if(existing.has(c.id))c.id=uid();contacts.push(c);});
      }
      saveOrg();rerender();
      toast('Imported '+cleaned.length+' people');
    }catch(e){toast('Could not read that file');}
  };
  reader.readAsText(file);
}
